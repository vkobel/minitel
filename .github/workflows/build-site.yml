name: build-site

on:
  push:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'deploy/build-site.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: ./deploy/build-site.sh

      - name: Fail if deploy/site is out of sync with source
        run: |
          if [ -n "$(git status --porcelain deploy/site)" ]; then
            echo "::error::deploy/site is stale. Run 'make site' and commit the rebuilt dist before pushing."
            git diff --stat deploy/site
            exit 1
          fi
          echo "deploy/site is in sync with source."
